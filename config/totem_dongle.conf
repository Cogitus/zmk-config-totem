CONFIG_ZMK_KEYBOARD_NAME="Totem"

# Sleep timeout: 20min (20*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# Increase BLE transmit power for better connection stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting to the host
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Dongle is central — fetch each peripheral's battery level and proxy to host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Prospector display — no ambient light sensor on this build, use fixed brightness
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Status screen layout
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
