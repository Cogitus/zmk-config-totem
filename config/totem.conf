CONFIG_ZMK_KEYBOARD_NAME="Totem"

# Set sleep timeout to 2C0min (20*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# enable zmk studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Increase BLE transmit power for better connection stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# for battery reporting apps
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# for battery reporting apps on split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
